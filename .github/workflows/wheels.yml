name: Packages and interoperability

on:
  push:
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run release packaging, audits, and all OS/Python combinations
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_matrix:
        description: Run release packaging, audits, and all OS/Python combinations
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  checks:
    if: ${{ !inputs.full_matrix }}
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "hatchling>=1.27,<2" "twine>=6" "setuptools>=77" numpy
      - run: dotnet test tests/SharpBind.Tests/SharpBind.Tests.csproj --filter 'TestCategory!=BuildIntegration'
      - run: python tests/package_smoke.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  desktop:
    if: inputs.full_matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            rid: win-x64
          - runner: macos-14
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "hatchling>=1.27,<2" "twine>=6" "setuptools>=77" numpy abi3audit
      - if: runner.os == 'macOS'
        run: python -m pip install delocate
      - run: dotnet test tests/SharpBind.Tests/SharpBind.Tests.csproj
      - run: python tests/package_smoke.py --audit
        id: packages
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.rid }}
          path: ${{ steps.packages.outputs.wheels }}/*.whl
          if-no-files-found: error
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: ${{ steps.packages.outputs.nuget }}/*.nupkg
          if-no-files-found: error

  linux:
    if: inputs.full_matrix
    runs-on: ubuntu-22.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "/opt/python/cp311-cp311/bin" >> "$GITHUB_PATH"
          dnf install -y clang lld zlib-devel libicu openssl-devel
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: python -m pip install "hatchling>=1.27,<2" "twine>=6" "setuptools>=77" numpy abi3audit "auditwheel>=6" "patchelf>=0.14"
      - run: dotnet test tests/SharpBind.Tests/SharpBind.Tests.csproj
      - run: python tests/package_smoke.py --audit
        id: packages
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x64
          path: ${{ steps.packages.outputs.wheels }}/*.whl
          if-no-files-found: error

  consumers:
    if: inputs.full_matrix
    needs: [desktop, linux]
    strategy:
      fail-fast: false
      matrix:
        target:
          - {runner: windows-2022, rid: win-x64}
          - {runner: ubuntu-22.04, rid: linux-x64}
          - {runner: macos-14, rid: osx-arm64}
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.target.rid }}
          path: wheels
      - run: python tests/install_wheels.py --wheels wheels
